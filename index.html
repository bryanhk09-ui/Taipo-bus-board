<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tai Po Bus Board</title>
<style>
:root{--fs:1;--bg:#0b0d10;--card:#161a20;--tx:#f2f4f7;--mut:#8b94a1;--acc:#ffb81c;--ok:#4ade80;--warn:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Noto Sans TC",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:2vmin;gap:1.6vmin;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:2vmin;flex:0 0 auto}
.hl{display:flex;align-items:baseline;gap:2vmin;min-width:0}
#clock{font-size:calc(7.5vmin*var(--fs));font-weight:700;letter-spacing:.02em;line-height:1}
#date{color:var(--mut);font-size:calc(2.8vmin*var(--fs))}
.rt{margin-left:auto;display:flex;align-items:center;gap:2vmin;flex-wrap:wrap;justify-content:flex-end}
#temp{display:none;text-align:right;font-size:calc(4.4vmin*var(--fs));font-weight:700;line-height:1}
#temp small{display:block;font-size:calc(1.9vmin*var(--fs));color:var(--mut);font-weight:400;margin-top:.4vmin}
#alert{display:none;gap:1.2vmin;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#gear{background:none;border:0;color:var(--mut);font-size:calc(3.6vmin*var(--fs));padding:.6vmin;margin-left:1vmin}
.wi{height:calc(6vmin*var(--fs));width:auto}
.wb{display:flex;align-items:center;gap:.8vmin;border-radius:1.2vmin;padding:.6vmin 1.4vmin;color:#fff;font-weight:800;font-size:calc(2.4vmin*var(--fs));background:#555}
.wb i{font-style:normal;font-size:calc(3.4vmin*var(--fs))}
.wb.y{background:#a16207}.wb.a{background:#b45309}.wb.r{background:#b91c1c}.wb.k{background:#000;border:1px solid #666}.wb.t{background:#1d4ed8}
main{flex:1 1 0;display:grid;gap:1.6vmin;min-height:0;grid-auto-rows:minmax(0,1fr)}
.card{background:var(--card);border-radius:2.2vmin;padding:1.8vmin 2vmin;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:1.2vmin}
.route{font-size:calc(7vmin*var(--fs));font-weight:800;color:var(--acc);line-height:1}
.op{font-size:calc(1.8vmin*var(--fs));font-weight:800;padding:.3vmin 1vmin;border-radius:.8vmin;color:#fff}
.op.KMB{background:#c8102e}.op.CTB{background:#f4c20d;color:#000}.op.GMB{background:#15803d}.op.SUN{background:#f59e0b;color:#000}
.dest{font-size:calc(2.5vmin*var(--fs));margin-top:.8vmin;line-height:1.15}
.stop{font-size:calc(1.9vmin*var(--fs));color:var(--mut);margin-top:.3vmin;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etas{margin-top:auto;padding-top:.8vmin}
.eta1{font-size:calc(8vmin*var(--fs));font-weight:800;color:var(--ok);line-height:1.05;white-space:nowrap}
.eta1 small{font-size:calc(3vmin*var(--fs));font-weight:600}
.eta2{font-size:calc(2.8vmin*var(--fs));font-weight:600;color:var(--tx)}
.none{font-size:calc(3.4vmin*var(--fs));color:var(--mut)}
footer{flex:0 0 auto;text-align:center;color:var(--mut);font-size:calc(1.9vmin*var(--fs))}
footer.err{color:var(--warn)}
#setup{position:fixed;inset:0;background:var(--bg);padding:4vmin;overflow:auto;display:none;z-index:10}
#setup h2{margin-top:0}
#setup label{display:block;margin:2vmin 0 .5vmin;color:var(--mut)}
#setup select,#setup button{font-size:max(16px,2.6vmin);padding:1.5vmin;width:100%;max-width:700px;border-radius:1vmin;border:1px solid #333;background:var(--card);color:var(--tx)}
#setup button{background:var(--acc);color:#000;font-weight:700;margin-top:3vmin;border:0}
main.wide .card{flex-direction:row;align-items:center;gap:1.6vmin}
main.wide .info{flex:1 1 auto;min-width:0}
main.wide .etas{margin-top:0;padding-top:0;text-align:right;flex:0 0 auto}
#fsb{display:flex;gap:1.2vmin;max-width:700px}
#fsb button{flex:1;margin-top:0;background:var(--card);color:var(--tx);border:1px solid #444;font-weight:700}
#fsb button.on{background:var(--acc);color:#000;border-color:var(--acc)}
#setup #close{background:var(--card);color:var(--tx);border:1px solid #444;margin-top:1.6vmin;display:none}
#setup .hint{color:var(--mut);font-size:max(13px,1.9vmin);margin:.8vmin 0 0}
</style>
</head>
<body>
<header>
  <div class="hl"><div id="clock">--:--</div><div id="date"></div></div>
  <div class="rt"><div id="temp"></div><div id="alert"></div></div>
  <button id="gear" aria-label="Settings">⚙</button>
</header>
<main id="board"></main>
<footer id="foot">Loading…</footer>
<div id="setup">
  <h2>Setup</h2>
  <label>Text size</label>
  <div id="fsb"><button data-s="S">S</button><button data-s="M">M</button><button data-s="L">L</button></div>
  <div style="color:var(--mut);margin-top:1vmin;font-size:max(13px,2vmin)">L is the largest size that fits your screen; M and S are smaller.</div>
  <p class="hint">Applies straight away. If a size won't fit your screen, the board shrinks the text automatically.</p>
  <button id="close">View board</button>
  <p id="setupMsg" style="color:var(--mut)">Looking up routes…</p>
  <div id="slots"></div>
  <button id="save">Save and start</button>
</div>
<script>
const KMB = "https://data.etabus.gov.hk/v1/transport/kmb", CTB = "https://rt.data.gov.hk/v2/transport/citybus", GMB = "https://data.etagmb.gov.hk";
// Your lines. dest = regex for the direction you want; hints = regexes to pre-select your stop.
const WANT = [
  { route: "64K",  op: "KMB", dest: /TAI PO MARKET/i, hints: [/san tsuen|sun tsuen|new village/i] },
  { route: "64K",  op: "KMB", dest: /YUEN LONG/i,     hints: [/tai wo plaza/i] },
  { route: "25K",  gmb: 1, dest: /TAI PO MARKET/i, hints: [/lam kam.*san tsuen/i, /san tsuen/i, /lam kam/i] },
  { route: "25K",  gmb: 1, dest: /LAM TSUEN|PAK NGAU/i, hints: [/tai wo shopping/i, /po nga/i] },
  { route: "E41",  op: "KMB", dest: /SKY|AIRPORT/i,   hints: [/civic|cultural/i] },
  { route: "A47X", op: "KMB", dest: /AIRPORT|HZMB|BRIDGE|ZHUHAI/i, hints: [/tai po centre/i, /terminus/i] },
  // return trips (boarding at the airport end, heading back to Tai Po)
  { route: "E41",  op: "KMB", dest: /TAI PO/i, hints: [/sky ?city/i, /terminus/i] },
  { route: "A47X", op: "KMB", dest: /TAI PO|TAI WO/i, hints: [/ground transport|gtc/i, /airport/i] }
];
const $ = id => document.getElementById(id);
let cfg = null;

// Sun Bus NR918 (residents' service): no public live feed, so scheduled departures from the Transport Department timetable (Sept 2024 edition)
const WK = ["06:35", "07:00", "07:20", "07:25", "07:30", "07:40", "07:50", "08:00"], SAT = ["07:15", "07:30", "07:50"];
const STATIC = [{ route: "NR918", op: "SUN", label: "To Wan Chai (residents' service)", name: "Lam Kam Road, Lam Tsuen · timetable, not live", sched: [[], WK, WK, WK, WK, WK, SAT] }];
const lines = () => (cfg || []).concat(STATIC);

// ---- Text size (S / M / L) with automatic fit ----
const FS = { S: 0.7, M: 0.85, L: 1 };  // fractions of the largest size that fits the screen
let fsKey = "M"; try { fsKey = localStorage.getItem("tpFs") || "M"; } catch (e) {}
function fit() {
  const root = document.documentElement, hd = document.querySelector("header");
  const over = k => {
    root.style.setProperty("--fs", k);
    return Array.prototype.some.call(document.querySelectorAll(".card"), el => el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2) || hd.scrollWidth > hd.clientWidth + 2 || hd.offsetHeight > window.innerHeight * 0.22;
  };
  let lo = 0.4, hi = 2.2;                       // find the largest scale that fits
  for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (over(mid)) hi = mid; else lo = mid; }
  let k = Math.max(0.4, Math.floor(lo * (FS[fsKey] || 0.85) * 20) / 20);
  for (let i = 0; i < 10 && k > 0.4 && over(k); i++) k = Math.round((k - 0.05) * 100) / 100;   // safety check
  root.style.setProperty("--fs", k);
}
function markFs() { Array.prototype.forEach.call(document.querySelectorAll("#fsb button"), b => b.classList.toggle("on", b.dataset.s === fsKey)); }
Array.prototype.forEach.call(document.querySelectorAll("#fsb button"), b => { b.onclick = () => { fsKey = b.dataset.s; try { localStorage.setItem("tpFs", fsKey); } catch (e) {} markFs(); fit(); }; });
$("close").onclick = () => { $("setup").style.display = "none"; fit(); };
markFs();

function sunHtml(c) {
  const h = new Date(Date.now() + 288e5), day = h.getUTCDay(), mins = h.getUTCHours() * 60 + h.getUTCMinutes();
  const toM = x => +x.slice(0, 2) * 60 + +x.slice(3);
  const today = (c.sched[day] || []).filter(x => toM(x) >= mins);
  if (today.length) return `<div class="eta1">${today[0]}</div><div class="eta2">in ${toM(today[0]) - mins} min${today.length > 1 ? " · then " + today.slice(1, 3).join(", ") : ""}</div>`;
  const N = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  for (let k = 1; k <= 7; k++) { const d = (day + k) % 7; if ((c.sched[d] || []).length) return `<div class="none">Next: ${N[d]} ${c.sched[d][0]}</div>`; }
  return `<div class="none">No service</div>`;
}


async function J(url, cache) {
  if (cache) { try { const c = JSON.parse(localStorage.getItem(url)); if (c && Date.now() - c.t < 6048e5) return c.d; } catch (e) {} }
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.data == null) throw new Error("no data");
  if (cache) { try { localStorage.setItem(url, JSON.stringify({ t: Date.now(), d: j.data })); } catch (e) {} }
  return j.data;
}
async function kmbNames() {
  const k = "tpKmbNames";
  try { const c = JSON.parse(localStorage.getItem(k)); if (c && Date.now() - c.t < 6048e5) return c.d; } catch (e) {}
  const l = await J(KMB + "/stop"), m = {};
  l.forEach(s => { m[s.stop] = s.name_en; });
  try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d: m })); } catch (e) {}
  return m;
}

// Work out which operator runs a route and list its directions / stops
async function resolve(w) {
  if (w.gmb) {
    const d = await J(GMB + "/route/NT/" + w.route, true), r = Array.isArray(d) ? d[0] : d;
    if (!r || !r.directions) throw new Error("minibus " + w.route + " not found");
    return { op: "GMB", dirs: r.directions.map(x => ({ label: "To " + x.dest_en, txt: x.dest_en, meta: { op: "GMB", rid: r.route_id, seq: x.route_seq },
      load: async () => { const s = await J(GMB + "/route-stop/" + r.route_id + "/" + x.route_seq, true); return (s.route_stops || []).map(y => ({ id: y.stop_id, seq: +y.stop_seq, name: y.name_en || String(y.stop_id) })); } })) };
  }
  if (w.op !== "CTB") try {
    const rs = (await J(KMB + "/route/", true)).filter(x => x.route === w.route);
    if (rs.length) return { op: "KMB", dirs: rs.map(x => ({ label: "To " + x.dest_en + (x.service_type !== "1" ? " (special)" : ""), txt: x.dest_en, meta: { op: "KMB", route: w.route, bound: x.bound, st: x.service_type },
      load: async () => { const p = await J(KMB + "/route-stop/" + w.route + "/" + (x.bound === "O" ? "outbound" : "inbound") + "/" + x.service_type, true), nm = await kmbNames(); return p.map(y => ({ id: y.stop, seq: +y.seq, name: nm[y.stop] || y.stop })); } })) };
  } catch (e) {}
  if (w.op === "KMB") throw new Error("KMB route " + w.route + " not found");
  const r = await J(CTB + "/route/CTB/" + w.route, true);
  if (!r || !r.route) throw new Error("route " + w.route + " not found");
  const mk = (b, path, txt) => ({ label: "To " + txt, txt: txt, meta: { op: "CTB", route: w.route, bound: b },
    load: async () => { let p = []; try { p = await J(CTB + "/route-stop/CTB/" + w.route + "/" + path, true); } catch (e) {}
      return Promise.all(p.map(async y => { let n = y.stop; try { n = (await J(CTB + "/stop/" + y.stop, true)).name_en || n; } catch (e) {} return { id: y.stop, seq: +y.seq, name: n }; })); } });
  return { op: "CTB", dirs: [mk("O", "outbound", r.dest_en), mk("I", "inbound", r.orig_en)] };
}

async function openSetup() {
  $("setup").style.display = "block";
  $("close").style.display = (cfg && cfg.length) ? "block" : "none";
  const box = $("slots"); box.innerHTML = ""; window._slots = [];
  $("setupMsg").textContent = "Looking up your routes…";
  const notes = [];
  for (const w of WANT) {
    try {
      const R = await resolve(w);
      const div = document.createElement("div");
      div.innerHTML = `<label>Route ${w.route} (${R.op}): direction</label>`;
      const dirSel = document.createElement("select"), stopSel = document.createElement("select");
      R.dirs.forEach((d, i) => dirSel.add(new Option(d.label, i)));
      let bi = R.dirs.findIndex(d => w.dest.test(d.txt)); dirSel.value = bi < 0 ? 0 : bi;
      const l2 = document.createElement("label"); l2.textContent = "Boarding stop";
      div.append(dirSel, l2, stopSel); box.append(div);
      const slot = { w, R, dirSel, stopSel, opts: [] };
      const fill = async () => {
        stopSel.innerHTML = ""; stopSel.add(new Option("Loading…", ""));
        let opts = []; try { opts = await R.dirs[+dirSel.value].load(); } catch (e) {}
        slot.opts = opts; stopSel.innerHTML = "";
        if (!opts.length) { stopSel.add(new Option("No stops in this direction", "")); return; }
        let best = -1; for (const h of w.hints) { best = opts.findIndex(o => h.test(o.name)); if (best >= 0) break; }
        opts.forEach((o, i) => { const op = new Option(o.seq + ". " + o.name, i); if (i === best) op.selected = true; stopSel.add(op); });
      };
      dirSel.onchange = fill; window._slots.push(slot); await fill();
    } catch (e) { notes.push(w.route + ": " + e.message); }
  }
  $("setupMsg").textContent = (window._slots.length ? "Check direction and boarding stop for each route, then save." : "Couldn't load any routes. Check your connection and reload.") + (notes.length ? " Skipped: " + notes.join("; ") : "");
}

$("save").onclick = () => {
  const out = [];
  for (const s of window._slots || []) {
    const o = s.opts[+s.stopSel.value], d = s.R.dirs[+s.dirSel.value];
    if (o) out.push({ route: s.w.route, op: s.R.op, label: d.label, name: o.name, meta: d.meta, stop: o.id, seq: o.seq });
  }
  if (!out.length) { $("setupMsg").textContent = "Pick a stop for at least one route first."; return; }
  cfg = out; try { localStorage.setItem("tpCfg2", JSON.stringify(cfg)); } catch (e) {}
  $("setup").style.display = "none"; draw(); refresh(); fit();
};
$("gear").onclick = openSetup;

function draw() {
  const n = lines().length, w = window.innerWidth, land = w > window.innerHeight, wide = n > 6 && w >= 600;
  $("board").className = wide ? "wide" : "";
  $("board").style.gridTemplateColumns = "repeat(" + (land ? (wide ? 3 : Math.ceil(n / 2)) : 2) + ",minmax(0,1fr))";
  $("board").innerHTML = lines().map((c, i) => `<section class="card"><div class="info"><div class="top"><div class="route">${c.route}</div><div class="op ${c.op}">${c.op}</div></div><div class="dest">${c.label}</div><div class="stop">${c.name}</div></div><div class="etas" id="e${i}"><div class="none">…</div></div></section>`).join("");
}
window.addEventListener("resize", () => { if (lines().length) { draw(); refresh(); } fit(); });

async function etaMins(c) {
  const now = Date.now(), m = c.meta;
  if (c.op === "KMB") { const d = await J(KMB + "/eta/" + c.stop + "/" + c.route + "/" + m.st); return d.filter(x => x.dir === m.bound && x.eta).map(x => Math.round((new Date(x.eta) - now) / 6e4)); }
  if (c.op === "CTB") { const d = await J(CTB + "/eta/CTB/" + c.stop + "/" + c.route); return d.filter(x => x.dir === m.bound && x.eta).map(x => Math.round((new Date(x.eta) - now) / 6e4)); }
  let d = await J(GMB + "/eta/route-stop/" + m.rid + "/" + m.seq + "/" + c.seq); if (!Array.isArray(d)) d = d.eta || [];
  return d.map(x => typeof x.diff === "number" ? x.diff : Math.round((new Date(x.timestamp) - now) / 6e4));
}

async function refresh() {
  let bad = false;
  await Promise.all(lines().map(async (c, i) => {
    if (c.op === "SUN") { $("e" + i).innerHTML = sunHtml(c); return; }
    try {
      const l = (await etaMins(c)).filter(x => x > -1).sort((a, b) => a - b).slice(0, 3);
      $("e" + i).innerHTML = l.length
        ? `<div class="eta1">${l[0] <= 0 ? "Now" : l[0] + "<small> min</small>"}</div>` + (l.length > 1 ? `<div class="eta2">then ${l.slice(1).join(", ")} min</div>` : "")
        : `<div class="none">No scheduled bus</div>`;
    } catch (e) { bad = true; }
  }));
  fit();
  $("foot").className = bad ? "err" : "";
  $("foot").textContent = bad ? "Some lines couldn't update, retrying…" : "KMB/LWB · GMB · NR918 timetable · updated " + new Date().toLocaleTimeString("en-HK", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function tick() {
  const n = new Date();
  $("clock").textContent = n.toLocaleTimeString("en-HK", { hour: "2-digit", minute: "2-digit", hour12: false });
  $("date").textContent = n.toLocaleDateString("en-HK", { weekday: "long", day: "numeric", month: "long" });
}
setInterval(tick, 1000); tick(); setInterval(refresh, 30000);

const WIMG = { WHOT: "vhot", WRAINA: "raina", WRAINR: "rainr", WRAINB: "rainb", TC1: "tc1", TC3: "tc3", TC8SE: "tc8b", TC8SW: "tc8c", TC8NE: "tc8ne", TC8NW: "tc8d", TC9: "tc9", TC10: "tc10", WTS: "ts", WFNTSA: "ntfl", WL: "landslip", WCOLD: "cold", WMSGNL: "sms", WFROST: "frost", WFIRER: "firer", WFIREY: "firey", WTMW: "tsunami-warn" };
function warnBadge(w) {
  const c = (w.code || "").toUpperCase(); let ic = "⚠️", lb = w.name, cl = "";
  if (c === "WRAINA") { ic = "🌧️"; lb = "Amber Rain"; cl = "a"; }
  else if (c === "WRAINR") { ic = "🌧️"; lb = "Red Rain"; cl = "r"; }
  else if (c === "WRAINB") { ic = "🌧️"; lb = "Black Rain"; cl = "k"; }
  else if (c.indexOf("TC") === 0) { ic = "🌀"; lb = "Typhoon " + c.replace("TC", "T").replace(/(NE|NW|SE|SW)$/, " $1"); cl = /TC(8|9|10)/.test(c) ? "r" : "t"; }
  else if (c === "WTS") { ic = "⛈️"; lb = "Thunderstorm"; cl = "y"; }
  else if (c === "WFIREY") { ic = "🔥"; lb = "Fire: Yellow"; cl = "y"; }
  else if (c === "WFIRER") { ic = "🔥"; lb = "Fire: Red"; cl = "r"; }
  else if (c === "WHOT") { ic = "🥵"; lb = "Very Hot"; cl = "r"; }
  else if (c === "WCOLD") { ic = "🥶"; lb = "Cold"; cl = "t"; }
  else if (c === "WFROST") { ic = "❄️"; lb = "Frost"; cl = "t"; }
  else if (c === "WMSGNL") { ic = "🌬️"; lb = "Strong Monsoon"; cl = "y"; }
  else if (c === "WL") { ic = "⛰️"; lb = "Landslip"; cl = "a"; }
  else if (c === "WTMW") { ic = "🌊"; lb = "Tsunami"; cl = "r"; }
  else if (c === "WFNTSA") { ic = "🌊"; lb = "Flooding (N. NT)"; cl = "a"; }
  const f = WIMG[c];
  if (!f) return `<div class="wb ${cl}"><i>${ic}</i>${lb}</div>`;
  return `<img class="wi" src="https://www.hko.gov.hk/en/wxinfo/dailywx/images/${f}.gif" alt="${w.name}" title="${w.name}" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="wb ${cl}" style="display:none"><i>${ic}</i>${lb}</div>`;
}
async function loadWx() {
  const U = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?lang=en&dataType=";
  try {
    const r = await Promise.all([fetch(U + "rhrread").then(x => x.json()), fetch(U + "fnd").then(x => x.json())]);
    const td = (r[0].temperature && r[0].temperature.data) || []; let now = null;
    for (let i = 0; i < td.length; i++) if (td[i].place === "Hong Kong Observatory") now = td[i].value;
    if (now === null && td.length) now = td[0].value;
    const t = r[1].weatherForecast && r[1].weatherForecast[0];
    if (now !== null) { $("temp").innerHTML = now + "°C" + (t ? "<small>Today " + t.forecastMintemp.value + "–" + t.forecastMaxtemp.value + "°</small>" : ""); $("temp").style.display = "block"; }
  } catch (e) {}
  try {
    const j = await (await fetch(U + "warnsum")).json();
    const list = Object.keys(j).map(k => j[k]).filter(w => w && w.name && w.actionCode !== "CANCEL");
    $("alert").innerHTML = list.map(warnBadge).join(""); $("alert").style.display = list.length ? "flex" : "none";
  } catch (e) {}
  fit();
  fit();
}
loadWx(); setInterval(loadWx, 900000);
